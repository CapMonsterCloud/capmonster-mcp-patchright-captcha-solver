name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx patchright install --with-deps chromium chrome

      - name: Test
        run: npm test

      - name: Publish to npm
        # TODO: switch to `github.ref == 'refs/heads/main'` once dev stabilizes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
